# Maltrail — server + sensor.
#
#     docker compose -f docker/docker-compose.yml up -d
#
# The build context is the repository root (`..`), not this directory: the Dockerfile needs the
# whole tree to build the sensor and to copy the server. Bind-mount sources are `../` for the
# same reason - compose resolves them against THIS file's directory, not the shell's, so `./`
# meant `docker/maltrail.conf`, which does not exist. Docker then created it as a directory and
# refused to mount a directory over a file, and `docker compose up` failed outright.

services:

  server:
    container_name: maltrail-server
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: maltrail:latest
    command: ["python3", "server.py"]
    restart: unless-stopped
    ports:
      - "8338:8338/tcp"     # reporting interface
      - "8337:8337/udp"     # event intake from remote sensors
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "../maltrail.conf:/opt/maltrail/maltrail.conf:ro"
      - "maltrail-logs:/var/log/maltrail"
      - "maltrail-state:/var/lib/maltrail"

  sensor:
    container_name: maltrail-sensor
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: maltrail:latest
    command: ["maltrail-sensor"]
    restart: unless-stopped
    # The image's default healthcheck asks the SERVER whether it is serving, because the image's
    # default command is server.py. This service runs a sensor, so it gets the sensor's own
    # preflight instead: `-T` validates configuration, trails, whitelist, log directory, capture
    # filter and capabilities, so unhealthy here means "has stopped being able to detect" rather
    # than "PID 1 still exists".
    #
    # It goes through the entrypoint so that `-T` runs as the same unprivileged uid the sensor
    # itself was dropped to. Called directly, a HEALTHCHECK does NOT pass through ENTRYPOINT, so
    # it would run as root - and root can write any log directory, which is exactly the failure
    # this check exists to catch.
    healthcheck:
      test: ["CMD", "/usr/local/bin/maltrail-entrypoint", "maltrail-sensor", "-T"]
      interval: 60s
      timeout: 30s
      start_period: 180s
      retries: 3
    depends_on:
      - server
    # Capturing needs the host's network namespace: inside the default bridge the sensor would
    # only ever see container traffic.
    network_mode: host
    # NOT privileged. Packet capture needs exactly these two capabilities.
    cap_add:
      - NET_RAW        # open the AF_PACKET socket
      - NET_ADMIN      # promiscuous mode and PACKET_FANOUT
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "../maltrail.conf:/opt/maltrail/maltrail.conf:ro"
      - "maltrail-logs:/var/log/maltrail"
      - "maltrail-state:/var/lib/maltrail"

volumes:
  maltrail-logs:
  maltrail-state:
