# Tag -> release. The gate runs FIRST; nothing is published unless it passes.
#
# The previous workflow built and pushed :latest on every tag without running a single test, so a
# broken commit could become the image everyone pulls. Ordering here is deliberate: verify, then
# build artifacts, then publish. A release that cannot be tested is not a release.
#
# It also ships prebuilt binaries. Requiring a Rust toolchain on every sensor host is the single
# biggest adoption barrier for a tool whose whole point is being easy to deploy widely.

name: Release

on:
  push:
    tags: [ '*' ]

permissions:
  contents: write        # create the release and upload artifacts
  packages: write        # push to ghcr.io
  id-token: write        # provenance attestation
  attestations: write

jobs:

  # Nothing below runs if this fails.
  gate:
    name: full gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r old/requirements.txt
      - run: bash sensor/tools/check.sh
      - run: bash tests/run.sh python3
      # The one check that only matters at release time: the tree's version must equal the tag.
      - name: Version matches the tag
        run: python3 sensor/tools/check_version.py --tag "${GITHUB_REF_NAME}"

  binaries:
    name: binary (${{ matrix.target }})
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            packages: libpcap-dev
          - target: aarch64-unknown-linux-gnu
            packages: libpcap-dev:arm64 gcc-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v7

      # Not a static build: the sensor links libpcap, and a genuinely static one means musl plus
      # a static libpcap, which is a separate packaging project. These are ordinary glibc builds
      # against the distribution's libpcap — install libpcap0.8 and they run.
      - name: Install cross toolchain
        run: |
          set -eu
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            # Ubuntu's amd64 mirrors do not carry arm64; the ports mirror does. So the existing
            # sources must be pinned to amd64 BEFORE arm64 is enabled, or `apt-get update` starts
            # asking archive.ubuntu.com for arm64 indexes and fails the job.
            #
            # 24.04 moved those sources to deb822 (/etc/apt/sources.list.d/*.sources); the old
            # one-line .list format may not exist at all. Handle both, and do not silently do
            # nothing if a future runner changes format again - if neither is found, stop.
            # A source that ALREADY states its architectures is left alone - it has made its own
            # decision and is presumed to mean it (the runner's microsoft-prod.list ships
            # `[arch=amd64,arm64,armhf signed-by=...]`, and blindly prepending a second option
            # block there produced "Malformed entry ... (URI parse)" and killed apt outright).
            # Only sources that say nothing get pinned, since those are the ones that would
            # otherwise be asked for arm64 indexes they do not carry.
            touched=0
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
              [ -f "$f" ] || continue
              sudo awk '
                /^deb(-src)?[[:space:]]/ {
                  if ($0 ~ /^deb(-src)?[[:space:]]+\[/) {
                    if ($0 !~ /arch=/) sub(/\[/, "[arch=amd64 ")   # options, but no arch
                  } else {
                    sub(/^deb(-src)?[[:space:]]+/, "& ")           # keep the verb, then...
                    sub(/[[:space:]]+ /, " [arch=amd64] ")         # ...insert the option block
                  }
                }
                { print }
              ' "$f" > /tmp/apt-pin.$$ && sudo cp /tmp/apt-pin.$$ "$f" && rm -f /tmp/apt-pin.$$
              touched=1
            done
            for f in /etc/apt/sources.list.d/*.sources; do
              [ -f "$f" ] || continue
              # One deb822 file holds SEVERAL stanzas (noble, -updates, -backports, -security)
              # separated by blank lines, so the key has to go into each of them: appending a
              # single line to the file reaches only the last stanza and leaves the rest asking
              # archive.ubuntu.com for arm64. RS="" splits on those blank lines.
              sudo awk 'BEGIN { RS = ""; ORS = "\n\n" }
                { if ($0 !~ /(^|\n)Architectures:/) sub(/(^|\n)Types:[^\n]*/, "&\nArchitectures: amd64"); print }
              ' "$f" > /tmp/apt-pin.$$ && sudo cp /tmp/apt-pin.$$ "$f" && rm -f /tmp/apt-pin.$$
              touched=1
            done
            [ "$touched" = 1 ] || { echo "::error::no apt sources found to pin to amd64"; exit 1; }

            # Prove the rewrite left apt able to parse its own configuration before going further,
            # so a bad edit fails HERE with the offending file named rather than 40 lines later.
            apt-get indextargets >/dev/null 2>&1 || { echo "::error::apt sources are unparseable after pinning"; grep -rn . /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null; exit 1; }

            codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
            sudo tee /etc/apt/sources.list.d/arm64-ports.sources >/dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: ${codename} ${codename}-updates ${codename}-security
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
            sudo dpkg --add-architecture arm64
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: '1'
        run: cargo build --release --locked --manifest-path sensor/Cargo.toml --target ${{ matrix.target }}

      - name: Package with a checksum
        run: |
          name="maltrail-sensor-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "sensor/target/${{ matrix.target }}/release/maltrail-sensor" "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  publish:
    name: publish release and image
    needs: [ gate, binaries ]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # A pre-release tag (v3.0-rc1) must NOT become what `docker pull maltrail` gives people,
      # and must not show up as the current release on the repository front page. Deciding this
      # from the tag name keeps it automatic: there is no "remember to untick latest" step to
      # forget at 2am, which is exactly when release tags get pushed.
      - name: Classify the tag
        id: tag
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/maltrail"
          {
            echo "tags<<TAGS_EOF"
            echo "${image}:${GITHUB_REF_NAME}"
            if printf '%s' "$GITHUB_REF_NAME" | grep -Eiq -- '-(rc|alpha|beta|pre)'; then
              echo "TAGS_EOF"
              echo "prerelease=true"
            else
              echo "${image}:latest"
              echo "TAGS_EOF"
              echo "prerelease=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch: sensors run on appliances and ARM boxes as often as on x86 servers.
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # ':latest' only for a real release — see "Classify the tag" above.
          tags: ${{ steps.tag.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Lets anyone verify the image was built from this repository at this tag, by this
      # workflow, rather than pushed by hand:
      #   gh attestation verify oci://ghcr.io/<owner>/maltrail:<tag> --repo <owner>/maltrail
      - name: Attest provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/maltrail
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
