# Tag -> release. The gate runs FIRST; nothing is published unless it passes.
#
# The previous workflow built and pushed :latest on every tag without running a single test, so a
# broken commit could become the image everyone pulls. Ordering here is deliberate: verify, then
# build artifacts, then publish. A release that cannot be tested is not a release.
#
# It also ships prebuilt binaries. Requiring a Rust toolchain on every sensor host is the single
# biggest adoption barrier for a tool whose whole point is being easy to deploy widely.

name: Release

on:
  push:
    tags: [ '*' ]

permissions:
  contents: write        # create the release and upload artifacts
  packages: write        # push to ghcr.io
  id-token: write        # provenance attestation
  attestations: write

jobs:

  # Nothing below runs if this fails.
  gate:
    name: full gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r old/requirements.txt
      - run: bash sensor/tools/check.sh
      - run: bash tests/run.sh python3
      # The one check that only matters at release time: the tree's version must equal the tag.
      - name: Version matches the tag
        run: python3 sensor/tools/check_version.py --tag "${GITHUB_REF_NAME}"

  binaries:
    name: binary (${{ matrix.target }})
    needs: gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            # A native arm64 runner, not QEMU and not a cross-compiler: the point of the build
            # container below is the C library it links against, and cross-compiling into an old
            # sysroot is a much worse way to get there.
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # Built INSIDE AlmaLinux 8, whose glibc is 2.28, because a binary cannot run on a system
      # whose glibc is older than the one it was built against. Built on the runner itself
      # (ubuntu-24.04, glibc 2.39) these binaries did not start on Debian 12, openSUSE Leap 15.6,
      # RHEL 8 or RHEL 9:
      #
      #     /lib64/libc.so.6: version `GLIBC_2.39' not found (required by maltrail-sensor)
      #
      # ...which is most of the enterprise Linux estate, and the failure is at exec, so there is no
      # partial functionality to notice. 2.28 covers RHEL 8+, Debian 10+, Ubuntu 18.04+ and Leap
      # 15.x. `docker run` rather than `container:` so the checkout happens on the host, where git
      # exists.
      #
      # Still not a static build: it links libpcap dynamically. AlmaLinux names that libpcap.so.1
      # and Debian/Ubuntu name the same ABI libpcap.so.0.8, so install.sh links whichever name is
      # missing - see link_libpcap_soname() there, tested on five distributions.
      - name: Build against glibc 2.28
        run: |
          set -eu
          docker run --rm -v "$PWD:/src" -w /src almalinux:8 sh -eu -c '
            dnf -y -q install dnf-plugins-core >/dev/null
            # libpcap-devel lives in PowerTools (AlmaLinux 8) / CRB (9+), which ship disabled.
            dnf config-manager --set-enabled powertools >/dev/null 2>&1 ||
              dnf config-manager --set-enabled crb >/dev/null 2>&1
            dnf -y -q install gcc libpcap-devel make >/dev/null
            export CARGO_HOME=/src/.cargo-home RUSTUP_HOME=/src/.rustup-home
            export PATH=$CARGO_HOME/bin:$PATH
            curl -sSf https://sh.rustup.rs -o /tmp/rustup.sh
            sh /tmp/rustup.sh -y --default-toolchain stable --profile minimal --no-modify-path >/dev/null
            rustc -V
            cargo build --release --locked --manifest-path sensor/Cargo.toml
            strip sensor/target/release/maltrail-sensor
          '
          sudo chown -R "$(id -u):$(id -g)" sensor/target .cargo-home .rustup-home

      # A guard, not a formality: this is the one property that cannot be checked by running the
      # binary on the build machine, and getting it wrong ships something that will not exec.
      - name: Refuse to publish a binary that needs a newer glibc
        run: |
          set -eu
          bin=sensor/target/release/maltrail-sensor
          highest=$(objdump -T "$bin" | sed -n 's/.*GLIBC_\([0-9.]*\).*/\1/p' | sort -V -u | tail -1)
          echo "highest glibc symbol required: $highest"
          printf '%s\n' "$highest" | grep -Eq '^2\.(1[0-9]|2[0-8])$|^2\.[0-9]$' || {
            echo "::error::built against glibc $highest; the baseline is 2.28 (RHEL 8 / Debian 10 / Leap 15)"
            exit 1
          }
          objdump -p "$bin" | grep NEEDED

      - name: Package with a checksum
        run: |
          name="maltrail-sensor-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp sensor/target/release/maltrail-sensor "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  publish:
    name: publish release and image
    needs: [ gate, binaries ]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # A pre-release tag (v3.0-rc1) must NOT become what `docker pull maltrail` gives people,
      # and must not show up as the current release on the repository front page. Deciding this
      # from the tag name keeps it automatic: there is no "remember to untick latest" step to
      # forget at 2am, which is exactly when release tags get pushed.
      - name: Classify the tag
        id: tag
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/maltrail"
          {
            echo "tags<<TAGS_EOF"
            echo "${image}:${GITHUB_REF_NAME}"
            if printf '%s' "$GITHUB_REF_NAME" | grep -Eiq -- '-(rc|alpha|beta|pre)'; then
              echo "TAGS_EOF"
              echo "prerelease=true"
            else
              echo "${image}:latest"
              echo "TAGS_EOF"
              echo "prerelease=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch: sensors run on appliances and ARM boxes as often as on x86 servers.
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # ':latest' only for a real release — see "Classify the tag" above.
          tags: ${{ steps.tag.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Lets anyone verify the image was built from this repository at this tag, by this
      # workflow, rather than pushed by hand:
      #   gh attestation verify oci://ghcr.io/<owner>/maltrail:<tag> --repo <owner>/maltrail
      - name: Attest provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/maltrail
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
