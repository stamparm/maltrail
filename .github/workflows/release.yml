# Tag -> release. The gate runs FIRST; nothing is published unless it passes.
#
# The previous workflow built and pushed :latest on every tag without running a single test, so a
# broken commit could become the image everyone pulls. Ordering here is deliberate: verify, then
# build artifacts, then publish. A release that cannot be tested is not a release.
#
# It also ships prebuilt binaries. Requiring a Rust toolchain on every sensor host is the single
# biggest adoption barrier for a tool whose whole point is being easy to deploy widely.

name: Release

on:
  push:
    tags: [ '*' ]

permissions:
  contents: write        # create the release and upload artifacts
  packages: write        # push to ghcr.io
  id-token: write        # provenance attestation
  attestations: write

jobs:

  # Nothing below runs if this fails.
  gate:
    name: full gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install libpcap
        if: ${{ matrix.kind == 'gnu' || matrix.kind == 'musl' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: bash sensor/tools/check.sh
      - run: bash tests/run.sh python3
      # The one check that only matters at release time: the tree's version must equal the tag.
      - name: Version matches the tag
        run: python3 sensor/tools/check_version.py --tag "${GITHUB_REF_NAME}"

  binaries:
    name: binary (${{ matrix.target }})
    needs: gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # windows-latest would otherwise run the shared steps below under pwsh, where none of their
    # shell syntax means anything. Steps that genuinely want pwsh ask for it.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            kind: gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            kind: gnu
            # A native arm64 runner, not QEMU and not a cross-compiler: the point of the build
            # container below is the C library it links against, and cross-compiling into an old
            # sysroot is a much worse way to get there.
            runner: ubuntu-24.04-arm
          # musl. Alpine used to be told the prebuilt sensor could not run there and to install a
          # Rust toolchain instead - but the sensor builds and runs on musl natively in about a
          # minute, so that was a missing artefact presented as a platform limit. Same native-runner
          # reasoning as above.
          - target: x86_64-unknown-linux-musl
            kind: musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            kind: musl
            runner: ubuntu-24.04-arm
          # macOS and FreeBSD. docs/compat records both installing and running with all thirty
          # marks, on a real Mac and a real FreeBSD VM - so the releases page carrying only Linux
          # made the documentation claim something the download page did not offer.
          #
          # Native runners again, for the same reason and one more: libpcap comes from the system
          # on both, and there is no old-sysroot equivalent to build against.
          - target: aarch64-apple-darwin
            kind: darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            kind: darwin
            runner: macos-15-intel
          - target: x86_64-unknown-freebsd
            kind: freebsd
            runner: ubuntu-latest
          # Windows. The old sensor could not go here at all - it was Python plus pcapy-ng, and
          # pcapy-ng on Windows was the reason the platform was written off. The Rust sensor talks
          # to libpcap, whose Windows implementation is Npcap, so what was a rewrite is a link
          # flag. Twenty-four compile errors stood in the way; they were platform assumptions, and
          # they are gone.
          - target: x86_64-pc-windows-msvc
            kind: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Built INSIDE AlmaLinux 8, whose glibc is 2.28, because a binary cannot run on a system
      # whose glibc is older than the one it was built against. Built on the runner itself
      # (ubuntu-24.04, glibc 2.39) these binaries did not start on Debian 12, openSUSE Leap 15.6,
      # RHEL 8 or RHEL 9:
      #
      #     /lib64/libc.so.6: version `GLIBC_2.39' not found (required by maltrail-sensor)
      #
      # ...which is most of the enterprise Linux estate, and the failure is at exec, so there is no
      # partial functionality to notice. 2.28 covers RHEL 8+, Debian 10+, Ubuntu 18.04+ and Leap
      # 15.x. `docker run` rather than `container:` so the checkout happens on the host, where git
      # exists.
      #
      # libpcap is linked STATICALLY, and is built here from source to do it.
      #
      # Not an optimisation - a correctness fix. A dynamically linked libpcap is requested by
      # SONAME, and the families disagree on what that name is: upstream, RHEL, Fedora and SUSE
      # call it libpcap.so.1, while Debian and Ubuntu ship the identical ABI as libpcap.so.0.8.
      # A binary built here therefore asked for a name that NO Debian or Ubuntu package provides,
      # and died before main() with
      #
      #     error while loading shared libraries: libpcap.so.1: cannot open shared object file
      #
      # on a machine that had libpcap installed all along. install.sh absorbs that by linking the
      # missing name, but nothing helps someone who downloads the tarball from the releases page,
      # which is what the releases page invites. Linking it in deletes the problem instead of
      # papering over it, and leaves libc as the only thing the tarball needs.
      #
      # AlmaLinux 8 ships no libpcap.a to link, so it is compiled from a pinned, checksummed
      # upstream release. The disabled features are capture back-ends the sensor does not use
      # (D-Bus, RDMA, nl80211 monitor mode, DAG/Septel/SNF/TurboCap, DPDK); dropping them is what
      # keeps the archive self-contained instead of pulling libnl, libdbus and libibverbs back in
      # as dynamic dependencies. The Linux PF_PACKET/TPACKET path the sensor actually captures
      # with is unaffected.
      # The build script goes through a QUOTED heredoc, not `sh -c '...'`. It used to be the
      # latter, and a comment mentioning "libpcap's configure" ended the single-quoted string on
      # its apostrophe - so the runner's own bash ran the rest, failed on ./configure, and every
      # release since 3.1.1 died there. A heredoc passes the body verbatim, so an apostrophe in a
      # comment cannot reach the shell that spawned it.
      - name: Build against glibc 2.28, with libpcap linked in
        if: ${{ matrix.kind == 'gnu' }}
        env:
          LIBPCAP_VERSION: 1.10.5
          LIBPCAP_SHA256: 37ced90a19a302a7f32e458224a00c365c117905c2cd35ac544b6880a81488f0
        run: |
          set -eu
          cat > "$RUNNER_TEMP/build-sensor.sh" <<'SCRIPT'
          set -eu
          dnf -y -q install gcc make flex bison >/dev/null

          curl -sSfL -o /tmp/libpcap.tar.gz \
            "https://www.tcpdump.org/release/libpcap-$LIBPCAP_VERSION.tar.gz"
          echo "$LIBPCAP_SHA256  /tmp/libpcap.tar.gz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/libpcap.tar.gz
          cd "/tmp/libpcap-$LIBPCAP_VERSION"
          test -x ./configure || { echo "[!] no ./configure in the libpcap tarball"; exit 1; }
          # No --enable-static: the configure script does not know that option and warns about it.
          # --disable-shared is what leaves libpcap.a as the only thing to link against.
          ./configure --prefix=/opt/libpcap --disable-shared \
            --disable-dbus --disable-rdma --without-libnl --without-dpdk \
            --without-dag --without-septel --without-snf --without-turbocap >/dev/null
          make -j"$(nproc)" >/dev/null
          make install >/dev/null
          cd /src

          export CARGO_HOME=/src/.cargo-home RUSTUP_HOME=/src/.rustup-home
          export PATH=$CARGO_HOME/bin:$PATH
          curl -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --default-toolchain stable --profile minimal --no-modify-path >/dev/null
          rustc -V
          # LIBPCAP_LIBDIR puts the static archive first on the link path; that directory holds
          # libpcap.a and no libpcap.so, so `-lpcap` can only resolve to the archive. LIBPCAP_VER
          # spares the pcap crate a dlopen() of a shared object that deliberately does not exist.
          # The sensor build script probes for a system libpcap it no longer needs.
          export LIBPCAP_LIBDIR=/opt/libpcap/lib
          export LIBPCAP_VER=$LIBPCAP_VERSION
          export MALTRAIL_SKIP_PCAP_CHECK=1
          cargo build --release --locked --manifest-path sensor/Cargo.toml
          strip sensor/target/release/maltrail-sensor
          SCRIPT
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/build-sensor.sh:/build-sensor.sh:ro" \
            -w /src -e LIBPCAP_VERSION -e LIBPCAP_SHA256 almalinux:8 sh -eu /build-sensor.sh
          sudo chown -R "$(id -u):$(id -g)" sensor/target .cargo-home .rustup-home

      # Guards, not formalities: these are the two properties that cannot be checked by running
      # the binary on the build machine, and getting either wrong ships something that will not
      # exec on someone else's.
      # Alpine builds it natively: musl-dev and libpcap-dev are two apk packages, and the result
      # is a static binary with no libc floor to get wrong. None of the glibc build's problems -
      # the 2.28 baseline, libpcap's SONAME differing between Debian and RHEL - exist here.
      - name: Build against musl
        if: ${{ matrix.kind == 'musl' }}
        run: |
          set -eu
          cat > "$RUNNER_TEMP/build-musl.sh" <<'SCRIPT'
          set -eu
          apk add --no-cache cargo libpcap-dev musl-dev >/dev/null
          cd /src/sensor
          RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --locked --bin maltrail-sensor
          strip target/release/maltrail-sensor
          SCRIPT
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/build-musl.sh:/build-musl.sh:ro" \
            alpine:3.20 sh /build-musl.sh
          sudo chown -R "$(id -u):$(id -g)" sensor/target

      - name: The musl binary must be static and must start
        if: ${{ matrix.kind == 'musl' }}
        run: |
          set -eu
          bin=sensor/target/release/maltrail-sensor
          # A musl binary that turned out dynamic would fail at exec on the machines this exists
          # for, and the failure would look exactly like the glibc one we are replacing.
          if ldd "$bin" 2>&1 | grep -qiE 'not a dynamic executable|statically linked'; then
            echo "[i] static"
          else
            echo "::error::the musl sensor is not static:"; ldd "$bin" || true; exit 1
          fi
          docker run --rm -v "$PWD/$bin:/s:ro" alpine:3.20 /s --version

      # macOS builds natively. libpcap is in the SDK, so there is no static-link dance and no
      # libc floor to get wrong - a darwin binary carries its own minimum OS version instead, and
      # the runner's SDK sets it.
      - name: Build on macOS
        if: ${{ matrix.kind == 'darwin' }}
        run: |
          set -eu
          cargo build --release --locked --manifest-path sensor/Cargo.toml --bin maltrail-sensor
          strip sensor/target/release/maltrail-sensor
          sensor/target/release/maltrail-sensor --version

      # FreeBSD has no hosted runner, so the build happens in a real VM on a Linux one - the same
      # mechanism docs/compat uses to record the FreeBSD row. copyback brings the binary out.
      - name: Build on FreeBSD
        if: ${{ matrix.kind == 'freebsd' }}
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.2'
          usesh: true
          copyback: true
          prepare: |
            pkg install -y rust
          run: |
            set -eu
            cd sensor
            cargo build --release --locked --bin maltrail-sensor
            strip target/release/maltrail-sensor
            ./target/release/maltrail-sensor --version

      - name: The binary must start
        if: ${{ matrix.kind == 'freebsd' }}
        run: |
          set -eu
          bin=sensor/target/release/maltrail-sensor
          test -x "$bin" || { echo "::error::no binary came back from the VM"; exit 1; }
          # Cannot be RUN here - it is a FreeBSD binary on a Linux runner. That it exists, is
          # executable and reports the right machine type is what can be checked from outside; the
          # VM already ran --version inside itself above.
          file "$bin"
          file "$bin" | grep -q 'FreeBSD' || { echo "::error::not a FreeBSD binary"; exit 1; }

      # wpcap.lib comes from the Npcap SDK, and only for the link: capturing needs the Npcap
      # DRIVER installed on the machine that runs the binary, which is why the archive says so.
      - name: Npcap SDK
        if: ${{ matrix.kind == 'windows' }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://npcap.com/dist/npcap-sdk-1.13.zip -OutFile sdk.zip
          Expand-Archive sdk.zip -DestinationPath $env:RUNNER_TEMP\npcap-sdk
          "LIB=$env:RUNNER_TEMP\npcap-sdk\Lib\x64;$env:LIB" >> $env:GITHUB_ENV

      - name: Build on Windows
        if: ${{ matrix.kind == 'windows' }}
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -eu
          cargo build --release --locked --manifest-path sensor/Cargo.toml --bin maltrail-sensor
          # --version needs no capture privilege and no driver, so it proves the link resolved and
          # the binary starts. Anything more would need Npcap installed on the runner.
          ./sensor/target/release/maltrail-sensor.exe --version

      - name: Refuse to publish a binary that needs a newer glibc, or a libpcap
        if: ${{ matrix.kind == 'gnu' }}
        run: |
          set -eu
          bin=sensor/target/release/maltrail-sensor
          highest=$(objdump -T "$bin" | sed -n 's/.*GLIBC_\([0-9.]*\).*/\1/p' | sort -V -u | tail -1)
          echo "highest glibc symbol required: $highest"
          printf '%s\n' "$highest" | grep -Eq '^2\.(1[0-9]|2[0-8])$|^2\.[0-9]$' || {
            echo "::error::built against glibc $highest; the baseline is 2.28 (RHEL 8 / Debian 10 / Leap 15)"
            exit 1
          }
          objdump -p "$bin" | grep NEEDED
          # A dynamic libpcap is requested by a SONAME the Debian family does not use, so this
          # would not start there at all. It is the exact failure this build was changed to end,
          # and it would come back silently the moment the static archive stopped being found.
          if objdump -p "$bin" | grep -q 'NEEDED.*libpcap'; then
            echo "::error::libpcap is linked dynamically; on Debian/Ubuntu this binary cannot start"
            exit 1
          fi
          echo "libpcap is linked statically"

      - name: Package with a checksum
        run: |
          set -eu
          name="maltrail-sensor-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ matrix.kind }}" = "windows" ]; then
            cp sensor/target/release/maltrail-sensor.exe "dist/$name/"
            # The binary links wpcap, so it needs the Npcap driver present to capture anything.
            # Someone who downloads this gets an .exe that runs, reports its version and then
            # cannot open an interface, with no file in the archive explaining why. This is that
            # file.
            cat > "dist/$name/NPCAP.txt" <<'NOTE'
          This sensor captures through Npcap, the Windows implementation of libpcap. The binary
          links against it, so it starts and answers --version without it - but opening an
          interface will fail until the driver is installed.

              https://npcap.com/#download

          Install it with WinPcap API compatibility enabled, then run the sensor from an elevated
          prompt: capture needs Administrator on Windows the way it needs root or CAP_NET_RAW
          elsewhere.

          Everything else works the same as on any other platform. `maltrail-sensor -T -c
          maltrail.conf` checks a configuration without capturing and needs no driver at all, so
          it is the right first command.
          NOTE
          else
            cp sensor/target/release/maltrail-sensor "dist/$name/"
          fi
          cp LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # macOS ships shasum, not sha256sum. The output format is the same either way, which is
          # what install.sh and the release page both read.
          if command -v sha256sum >/dev/null; then
            ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )
          else
            ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  publish:
    name: publish release and image
    needs: [ gate, binaries ]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # A pre-release tag (v3.0-rc1) must NOT become what `docker pull maltrail` gives people,
      # and must not show up as the current release on the repository front page. Deciding this
      # from the tag name keeps it automatic: there is no "remember to untick latest" step to
      # forget at 2am, which is exactly when release tags get pushed.
      - name: Classify the tag
        id: tag
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/maltrail"
          {
            echo "tags<<TAGS_EOF"
            echo "${image}:${GITHUB_REF_NAME}"
            if printf '%s' "$GITHUB_REF_NAME" | grep -Eiq -- '-(rc|alpha|beta|pre)'; then
              echo "TAGS_EOF"
              echo "prerelease=true"
            else
              echo "${image}:latest"
              echo "TAGS_EOF"
              echo "prerelease=false"
            fi
          } >> "$GITHUB_OUTPUT"

      # A snapshot of the trail set, shipped with the release. Static trails live in their own
      # repository and are fetched at runtime, so without this a first start with no connectivity
      # has nothing to match on - and this is the release that introduces that. install.sh seeds
      # the runtime cache from it, so an air-gapped deployment detects from the moment it starts.
      - name: Bootstrap trail set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo stamparm/trails --pattern 'trails.csv.gz' --output dist/trails-bootstrap.csv.gz
          gh release download --repo stamparm/trails --pattern 'trails.csv.sha256' --output dist/trails-bootstrap.csv.sha256
          rows=$(gzip -dc dist/trails-bootstrap.csv.gz | wc -l)
          echo "[i] bootstrap: $rows trails"
          if [ "$rows" -lt 1000000 ]; then
            echo "::error::the bootstrap trail set looks collapsed ($rows rows) - refusing to ship it"
            exit 1
          fi
          # The published digest is over the UNCOMPRESSED set; check it here rather than shipping
          # a snapshot nobody verified.
          have=$(gzip -dc dist/trails-bootstrap.csv.gz | sha256sum | cut -d' ' -f1)
          want=$(cut -d' ' -f1 < dist/trails-bootstrap.csv.sha256)
          if [ "$have" != "$want" ]; then
            echo "::error::bootstrap digest mismatch ($have != $want)"
            exit 1
          fi
          echo "[i] digest verified: $have"

      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch: sensors run on appliances and ARM boxes as often as on x86 servers.
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # ':latest' only for a real release — see "Classify the tag" above.
          tags: ${{ steps.tag.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Lets anyone verify the image was built from this repository at this tag, by this
      # workflow, rather than pushed by hand:
      #   gh attestation verify oci://ghcr.io/<owner>/maltrail:<tag> --repo <owner>/maltrail
      - name: Attest provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/maltrail
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
