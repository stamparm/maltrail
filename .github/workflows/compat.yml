# Where does Maltrail actually run?
#
# The README claimed six platforms; the harness covered five, and none of the result was published.
# The first widening to twelve found install.sh dead on the whole RHEL 9 family - curl-minimal
# conflicts with curl, dnf refused the transaction, and NOTHING installed - while Arch had worked
# since pacman support landed with nobody able to say so.
#
# So this records rather than asserts. Each job installs Maltrail in a real image, asks it
# questions, and uploads a row; the last job renders them into docs/compat and fails if the
# published page disagrees. A table nobody types cannot drift into marketing.
#
# The sensor comes from the RELEASE, not from a build here, and that is not incidental: a sensor
# built on 24.04 carries a glibc 2.39 floor and will not run on Debian 12, Rocky 9 or Leap 15.6 -
# which made five supported platforms look unsupported the first time this was recorded. The
# release targets 2.28.

name: Compatibility

on:
  schedule:
    - cron: '19 4 * * 2'
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - 'install.sh'
      - 'tests/install/**'
      - '.github/workflows/compat.yml'

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.label }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: ubuntu,     runner: ubuntu-latest, arch: x86_64 }
          - { label: ubuntu2204, runner: ubuntu-latest, arch: x86_64 }
          - { label: debian,     runner: ubuntu-latest, arch: x86_64 }
          - { label: debian13,   runner: ubuntu-latest, arch: x86_64 }
          - { label: fedora,     runner: ubuntu-latest, arch: x86_64 }
          - { label: fedora41,   runner: ubuntu-latest, arch: x86_64 }
          - { label: rocky,      runner: ubuntu-latest, arch: x86_64 }
          - { label: alma,       runner: ubuntu-latest, arch: x86_64 }
          - { label: arch,       runner: ubuntu-latest, arch: x86_64 }
          - { label: opensuse,   runner: ubuntu-latest, arch: x86_64 }
          - { label: tumbleweed, runner: ubuntu-latest, arch: x86_64 }
          - { label: alpine,     runner: ubuntu-latest, arch: x86_64, libc: musl }
          # aarch64 is BUILT and shipped with every release and has never once been installed in a
          # test. These are the same images on an arm runner.
          - { label: ubuntu,     runner: ubuntu-24.04-arm, arch: aarch64 }
          - { label: debian13,   runner: ubuntu-24.04-arm, arch: aarch64 }
          - { label: fedora,     runner: ubuntu-24.04-arm, arch: aarch64 }
          - { label: alma,       runner: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the released sensor for this architecture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # The libc is part of the target. Alpine gets the musl build - it used to be told there
          # was none and to install a Rust toolchain instead.
          target="${{ matrix.arch }}-unknown-linux-${{ matrix.libc || 'gnu' }}"
          mkdir -p /tmp/sensor
          # A release without an asset for this target is a real answer, not a reason to fall back
          # to a locally built one - that is what made Debian 12 look unsupported.
          #
          # musl is the exception, and only until a release carries it: the targets were added
          # after 3.3, so there is nothing to download yet. Built here instead, the same way
          # release.yml builds it, rather than leaving Alpine's sensor columns blank for a release
          # cycle.
          if ! gh release download --repo "$GITHUB_REPOSITORY" \
                 --pattern "maltrail-sensor-*-${target}.tar.gz" --dir /tmp/sensor 2>/dev/null; then
            case $target in
              *-musl)
                echo "[i] no released ${target} asset yet - building one"
                docker run --rm -v "$PWD:/src:ro" -v /tmp/sensor:/out alpine:3.20 sh -c '
                  set -e
                  apk add --no-cache -q cargo libpcap-dev musl-dev >/dev/null
                  mkdir -p /tmp/b && cd /tmp/b
                  tar -C /src -cf - --exclude=sensor/target --exclude=.git sensor data core | tar -xf -
                  cd sensor && cargo build --release --bin maltrail-sensor >/dev/null 2>&1
                  strip target/release/maltrail-sensor
                  cp target/release/maltrail-sensor /out/'
                ;;
              *) echo "::error::no released asset for ${target}"; exit 1 ;;
            esac
          else
            tar xzf /tmp/sensor/*.tar.gz -C /tmp/sensor
          fi
          find /tmp/sensor -name maltrail-sensor -type f -print

      - name: Record the row
        env:
          MALTRAIL_RECORDED_BY: ci
        run: |
          set -eu
          # Clear the committed rows first, so this job's artifact carries ONLY the row it just
          # recorded. Uploading the whole directory meant sixteen artifacts each holding a dozen
          # overlapping filenames, and merge-multiple made a mess of the collisions - the page job
          # then read a file containing two JSON documents.
          rm -f docs/compat/rows/*.json
          bin=$(find /tmp/sensor -name maltrail-sensor -type f | head -1)
          # run.sh picks the musl binary for musl environments; give it both so it never has to
          # build one itself here.
          export MALTRAIL_TEST_SENSOR="$bin" MALTRAIL_TEST_SENSOR_MUSL="$bin"
          python3 tests/install/record.py record ${{ matrix.label }}
          ls -1 docs/compat/rows/

      - uses: actions/upload-artifact@v4
        with:
          name: compat-row-${{ matrix.label }}-${{ matrix.arch }}
          path: docs/compat/rows/*.json
          if-no-files-found: error

  # A container shares the host kernel, so there is no image that stands in for these. FreeBSD gets
  # a real VM on a Linux runner; macOS gets a real Mac. Both run assert.sh natively - it is POSIX sh
  # and takes MALTRAIL_SRC, so the same checks that run in the containers run here.
  #
  # The sensor is built in-place rather than downloaded: no release carries a FreeBSD or darwin
  # target yet. Proving install.sh, the rc.d/launchd scripts and the sensor work on these platforms
  # is what decides whether adding those targets is worth doing.
  freebsd:
    name: freebsd (native VM)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/freebsd-vm@v1
        with:
          release: '14.2'
          usesh: true
          copyback: true
          prepare: |
            pkg install -y git python3 rust
          run: |
            set -eu
            cd /home/runner/work/maltrail/maltrail || cd "$GITHUB_WORKSPACE"
            echo "--- building the sensor ---"
            cd sensor && cargo build --release --bin maltrail-sensor && cd ..
            echo "--- recording the row ---"
            MALTRAIL_TEST_SENSOR="$PWD/sensor/target/release/maltrail-sensor" \
              python3 tests/install/record.py record freebsd --native || true
            python3 - <<'PY'
            import io, os
            raw = os.path.join(".compat-raw", "freebsd.out")
            text = io.open(raw, encoding="utf-8", errors="replace").read() if os.path.isfile(raw) else ""
            print("marks: %d" % text.count("\nA "))
            for line in text.splitlines():
                if line.startswith(("F ", "P ")):
                    print(line)
            PY
      - uses: actions/upload-artifact@v4
        with:
          name: compat-raw-freebsd
          path: .compat-raw
          if-no-files-found: warn

  macos:
    name: ${{ matrix.label }} (native)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: macos-arm64, runner: macos-latest }
          - { label: macos-intel, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the sensor
        run: cargo build --release --manifest-path sensor/Cargo.toml --bin maltrail-sensor
      - name: Record the row
        env:
          MALTRAIL_RECORDED_BY: ci
        run: |
          set -eu
          sudo MALTRAIL_TEST_SENSOR="$PWD/sensor/target/release/maltrail-sensor" \
            MALTRAIL_RECORDED_BY=ci \
            python3 tests/install/record.py record ${{ matrix.label }} --native || true
          # Whatever happened, publish what was observed - a row that says a capability failed is
          # the point of recording, not a reason to hide the run.
          sed -n 's/^[AFP] //p' .compat-raw/${{ matrix.label }}.out | head -60 || true
      - uses: actions/upload-artifact@v4
        with:
          name: compat-raw-${{ matrix.label }}
          path: .compat-raw
          if-no-files-found: warn

  page:
    name: the published page says what the rows say
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/rows
          pattern: compat-row-*
          merge-multiple: true
      # NOT `render --check` against these rows. They were recorded minutes ago on CI, so they
      # carry today's date and recorded_by=ci and will never equal the committed page - checking
      # them against it would fail every single run and teach everyone to ignore this job. The
      # drift guard is tests/test_compat.py, which compares the COMMITTED page with the COMMITTED
      # rows. What this job is for is producing fresh evidence and showing what changed.
      - name: Render the page these rows produce
        run: |
          set -eu
          cp /tmp/rows/*.json docs/compat/rows/
          python3 tests/install/record.py render
          echo "### Platform matrix" >> "$GITHUB_STEP_SUMMARY"
          sed -n '/^| Platform/,/^$/p' docs/compat/README.md >> "$GITHUB_STEP_SUMMARY"
          if ! git diff --quiet docs/compat; then
            echo "[i] the recorded rows differ from what is committed:"
            git --no-pager diff --stat docs/compat
            echo "[i] commit docs/compat to publish them"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: compat-page
          path: docs/compat
