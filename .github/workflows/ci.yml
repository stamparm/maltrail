# The gate. Every job here is the same thing a developer runs locally, so a green tick means
# `sensor/tools/check.sh` and `tests/run.sh` were actually executed — not approximated.
#
# Nothing in this repository is allowed to depend on someone remembering to run the tests.

name: CI

# Trail data is pushed many times a day and cannot affect the sensor's behaviour — it is the
# input, not the program. Running a ten-minute Rust gate on every indicator commit would make CI
# a tax on the project's most common and most valuable contribution, and a queue nobody waits
# for is a queue nobody trusts. Code, configuration, packaging and the runtime data files under
# data/ all still gate normally.
on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - 'CHANGELOG'
      - 'LICENSE'
      - 'CITATION.cff'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - 'CHANGELOG'
      - 'LICENSE'
      - 'CITATION.cff'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # The full Rust gate: generated-file freshness, fmt, clippy -D warnings, the suite in BOTH
  # debug (overflow checks on) and release (what ships), then differential parity against the
  # old Python sensor. Its real-trails steps self-skip here, because a runner has no trails.csv;
  # the `real-trails` job below builds one and runs the tests that need it.
  # src/settings_gen.rs is transcribed from core/settings.py and data/ua.txt, and the Python side
  # reads those at runtime while the sensor COMPILES them in. Let them drift and the two sensors
  # disagree in a way the parity harness structurally cannot see, because each is internally
  # consistent. check.sh catches it, but ~3 minutes in and behind a 45-minute job; this answers in
  # seconds, on its own, so the person who edited a constant is told by the first thing that
  # finishes. It has been forgotten four times.
  generated:
    name: generated constants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 sensor/tools/gen_settings.py --check

  sensor:
    name: sensor gate (check.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcap-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sensor

      - run: bash sensor/tools/check.sh

      - name: Python suite
        run: bash tests/run.sh python3

  # The tests that need a REAL trail set, with one built for them.
  #
  # `tests/trails.rs` and `tests/loader_parity.rs` carry the two strongest assertions in the
  # repository — every row of the real trails.csv is findable with its own (info, reference), and
  # every row is loaded byte-identically to `core.common.load_trails()` — and both self-skip when
  # the machine has no trails file. On a runner that was always, so both printed `[skip]` and the
  # gate was green without them: the no-false-negative invariant behind the trail store's negative
  # prefilter was verified only on a developer's laptop, which is not a verification anyone else
  # can reproduce. `--offline` builds the set from the static pile in this checkout, no feed
  # fetched, which is exactly what the `floor` job already proves works on Python 3.6.
  #
  # (The generated-at-scale half of that invariant runs everywhere and needs no trail set:
  # `the_negative_filter_never_hides_a_key_at_real_scale` in tests/trails.rs.)
  real-trails:
    name: real trail set
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # tests/trail_update.rs needs the trail SOURCE TREE, not the assembled set: it seeds a
      # fixture's static cache by running core.assemble over a checkout. Without one its
      # static_trails_dir() returns None and both of its content tests - including THE regression
      # test for the field miss, a stale trails file failing to pick up a newly added static IOC -
      # print "[skip]" and PASS. They did exactly that on every run from the split until now.
      - uses: actions/checkout@v7
        with:
          repository: stamparm/trails
          path: trails-content

      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcap-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sensor

      # Static trails are published as an assembled aggregate now, so `--offline` no longer
      # produces one: it would build from the engine's own lists alone and these tests would run
      # against ~20k rows while still reporting green. Fetch the real set, without the 39 feeds -
      # this job is about the trail STORE at scale, not about feed availability.
      - name: Build a trail set from the published aggregate
        run: |
          sed 's/^USE_FEED_UPDATES .*/USE_FEED_UPDATES false/' maltrail.conf > /tmp/ci.conf
          python3 sensor/tools/update_trails.py -c /tmp/ci.conf 2>&1 | grep -v '^\[?\] progress' | tail -4
          test -s "$HOME/.maltrail/trails.csv"
          rows=$(wc -l < "$HOME/.maltrail/trails.csv")
          echo "trails built: $rows rows"
          # The tests below assert "a sizeable trail set"; say so here instead of letting them
          # fail three minutes later with a number and no explanation.
          if [ "$rows" -lt 1000000 ]; then
            echo "::error::only $rows trails - the aggregate was not fetched"
            exit 1
          fi

      # --nocapture so the row counts, store size and parity numbers are in the log. A skipped
      # test PASSES, which is the failure mode this job exists to remove, so the skip note is
      # also grepped for: green here has to mean the walk actually ran.
      - name: Real-trail invariants (every row findable, loader parity with Python)
        run: |
          set -o pipefail
          cargo test --manifest-path sensor/Cargo.toml --release \
            --test trails --test loader_parity -- --nocapture 2>&1 | tee /tmp/real-trails.log
          if grep -q '\[skip\] no real trails file' /tmp/real-trails.log; then
            echo "::error::the real-trail tests skipped despite a trail set having been built"
            exit 1
          fi

      # The updater end to end: builds a missing trails file, refreshes a stale one, and detects an
      # IOC that was added after that file was written. It needs the release binary, so build it.
      - name: The updater, against the real content
        env:
          MALTRAIL_TRAILS_DIR: ${{ github.workspace }}/trails-content
        run: |
          set -o pipefail
          cargo build --manifest-path sensor/Cargo.toml --release
          cargo test --manifest-path sensor/Cargo.toml --release \
            --test trail_update -- --nocapture 2>&1 | tee /tmp/trail-update.log
          # Same reasoning as above: these tests pass when they skip, so green has to mean they ran.
          if grep -q '\[skip\]' /tmp/trail-update.log; then
            echo "::error::a trail_update test skipped - see the [skip] line for which knob it wanted"
            grep '\[skip\]' /tmp/trail-update.log
            exit 1
          fi

  # The declared MSRV is a promise to operators on older distributions. Compile it, or it is
  # just a number in Cargo.toml. Deliberately NOT a rust-toolchain.toml: pinning that file would
  # make the repository's default toolchain the minimum one for every contributor.
  msrv:
    name: MSRV (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        rust: [ "1.74" ]
    steps:
      - uses: actions/checkout@v7
      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcap-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sensor
          key: msrv-${{ matrix.rust }}
      - name: Verify the crate builds on its declared minimum
        run: cargo check --manifest-path sensor/Cargo.toml --all-targets

  # The sensor captures through libpcap, which is native on macOS and the BSDs - nothing about it
  # is Linux-only except PACKET_FANOUT, a kernel-side load balancer for multi-worker capture. That
  # was not obvious: `cargo check --target x86_64-unknown-freebsd` reported three errors, all of
  # them AF_PACKET/SOL_PACKET in one file, and everything else compiled.
  #
  # This keeps it that way. A Linux-only libc call added to a shared path compiles fine here and
  # breaks a platform nobody builds on daily, and the person who finds out is a FreeBSD user, not
  # us. Checking only - linking needs each platform's libpcap, which is what the native jobs are
  # for.
  portability:
    name: compiles for ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-freebsd
          - aarch64-unknown-freebsd
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sensor
          key: portability-${{ matrix.target }}
      - run: cargo check --manifest-path sensor/Cargo.toml --target ${{ matrix.target }}

  # Windows, and deliberately NOT required to pass yet.
  #
  # The sensor captures through libpcap, which exists on Windows as Npcap - so the question is not
  # the capture path but the handful of places that assume a POSIX system: the selectable capture
  # descriptor, file-mode bits, SIGHUP, and geteuid. There is no setuid or chown anywhere, which is
  # what made this look far worse than it is from a distance.
  #
  # continue-on-error, because this job exists to REPORT the remaining distance rather than to
  # block a release on a platform Maltrail does not claim yet. The day it passes clean is the day
  # that claim becomes honest.
  windows:
    name: sensor (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Npcap SDK
        shell: pwsh
        run: |
          # libpcap's Windows implementation. The SDK carries wpcap.lib, which is what the pcap
          # crate links against; the driver itself is only needed to CAPTURE, not to build.
          Invoke-WebRequest -Uri https://npcap.com/dist/npcap-sdk-1.13.zip -OutFile sdk.zip
          Expand-Archive sdk.zip -DestinationPath $env:RUNNER_TEMP\npcap-sdk
          "LIB=$env:RUNNER_TEMP\npcap-sdk\Lib\x64;$env:LIB" >> $env:GITHUB_ENV

      # This job used to be `windows-distance`, continue-on-error, counting how many errors stood
      # between the sensor and Windows. It was twenty-four. They are gone, so it builds for real
      # and fails the build if that regresses.
      #
      # CARGO_TERM_COLOR matters here for a reason worth keeping: the workflow sets it to `always`,
      # which prefixes every diagnostic with an ANSI escape, and the distance job's `^error` grep
      # therefore matched nothing and reported "errors: 0" against twenty-four of them.
      - name: Build
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: cargo build --manifest-path sensor/Cargo.toml --release

      # Nothing built here can be RUN on a hosted runner, and it is worth being precise about
      # why. wpcap is linked at LOAD time, so wpcap.dll must exist for the process to start at
      # all - `--version` included. wpcap.dll comes with the Npcap driver, and Npcap's free
      # edition has no unattended installer, so a hosted Windows runner cannot have it.
      #
      # The free edition's installer is interactive by design; the silent switch is in the paid
      # OEM build. Rather than fake it, this checks the property that would actually regress: that
      # the link resolved against the SDK's wpcap.lib. If the SDK step above ever stops working,
      # the build fails; if it links against the wrong thing, this does.
      - name: The binary must import wpcap
        shell: pwsh
        run: |
          $bin = "sensor/target/release/maltrail-sensor.exe"
          if (-not (Test-Path $bin)) { throw "no binary was produced" }
          $dumpbin = Get-ChildItem -Path "C:\Program Files*\Microsoft Visual Studio" -Recurse `
            -Filter dumpbin.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dumpbin) {
            Write-Host "::warning::dumpbin not found; skipping the import check"
            exit 0
          }
          $imports = & $dumpbin.FullName /dependents $bin
          $imports | Select-String -Pattern '\.dll'
          if (-not ($imports | Select-String -Quiet -Pattern 'wpcap\.dll')) {
            throw "the binary does not import wpcap.dll - it cannot capture anything"
          }
          Write-Host "wpcap.dll is imported"

      # The test binaries link wpcap too, so they cannot run here either. Compiling them is still
      # worth doing: it is what caught that capture_live.rs and trail_update.rs assumed a Unix
      # host, and it is the check that keeps them compiling for Windows as they change.
      - name: Tests must compile
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: cargo test --manifest-path sensor/Cargo.toml --release --no-run

  # A workflow can be wrong in ways YAML is happy with. release.yml's gate guarded its libpcap
  # install on `matrix.kind` in a job that has no matrix: the expression was silently empty, the
  # step never ran, and the gate could not link the sensor - which nothing revealed until a
  # release tag was pushed. tests/test_workflows.py now catches that exact shape; actionlint
  # catches the family it belongs to (undefined contexts, `needs` on a job that does not exist,
  # shellcheck over every `run:` block).
  #
  # Pinned and checksummed rather than taken from an action, so what runs here is decided in this
  # file and cannot change under us.
  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.7
      ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          set -eu
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o /tmp/actionlint.tar.gz "$url"
          echo "$ACTIONLINT_SHA256  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/actionlint.tar.gz actionlint
          /tmp/actionlint -version
          # Note: the runner has shellcheck, so every `run:` block here is linted as a script too.
          # (This comment must not START with the tool's name: a `#` followed by it is read as a
          # directive, and prose there fails to parse as one - SC1072/SC1073.)
          /tmp/actionlint

  # The Windows job above builds and checks the import table. It cannot run anything, because
  # wpcap is a load-time dependency and wpcap.dll ships with the Npcap driver, whose free edition
  # refuses a silent install (`npcap.exe /S` exits 2; measured, not assumed).
  #
  # That is true of a Windows runner and irrelevant on a Linux one. mingw-w64 cross-compiles the
  # binary, 7z lifts wpcap.dll straight out of the Npcap installer's NSIS archive without running
  # it, and Wine executes the result. So the Windows sensor's own unit suite runs here, its -T
  # self-test runs against the shipped maltrail.conf, every pcap in the corpus is replayed through
  # both the Windows and the native binary with the detections compared byte for byte, and the
  # server answers /ping under a real Windows Python (the embeddable build, which is a zip and
  # needs no installer either).
  #
  # Four real bugs came out of the first run - a dropped drive letter in every absolute config
  # path, an interpreter search that could never match python.exe, a log directory the server and
  # sensor disagreed about, and a disk-space check that never ran. None of them were reachable by
  # compiling.
  #
  # What this still does not cover is live capture, which needs the kernel driver and a real
  # Windows machine. The script says so in its own header rather than leaving it implied.
  windows-runtime:
    name: sensor runs (Windows via Wine)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cross-compiler, Wine and 7z
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 p7zip-full wine wine64 libpcap-dev
          x86_64-w64-mingw32-gcc --version | head -1
          wine --version

      - name: Build it for Windows, then run it
        env:
          # Wine's own diagnostics are noise here, and a failure surfaces as a non-zero exit from
          # the script rather than as a line in the log.
          WINEDEBUG: '-all'
        run: sh sensor/tools/check_windows.sh --work "$RUNNER_TEMP/win"

  # The oldest interpreter Maltrail claims to run on, tested on the interpreter itself rather than
  # asserted in a README. One 3.7-only method call (str.isascii) once made the updater die on every
  # RHEL 8 / CentOS 7 / Leap 15 / Amazon Linux 2 box - empty trail set, sensor detecting nothing,
  # no error that said so. Its own job because GitHub retired the runners that could install 3.6,
  # so this runs in the official 3.6 image.
  floor:
    name: server tests (Python 3.6, the floor)
    runs-on: ubuntu-latest
    container: python:3.6-slim
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/run.sh python3

      # The suite proves the modules import and behave; this proves what actually broke on old
      # interpreters - that a trail set can be BUILT at all. Offline on purpose: it drives
      # core/update.py over the whole static pile without touching a third-party feed from CI.
      - name: Build a trail set
        run: |
          python3 sensor/tools/update_trails.py --offline -c maltrail.conf 2>&1 | grep -v '^\[?\] progress' | tail -4
          test -s "$HOME/.maltrail/trails.csv"
          echo "trails built: $(wc -l < "$HOME/.maltrail/trails.csv") lines"

  # setup-python no longer ships 3.7 for ubuntu-24.04, hence the pinned older runner for that entry.
  #
  # The server is standard library only, and that is exactly what this matrix is proving: nothing
  # here installs a third-party package. The suite has no optional dependency left - it used to
  # need pcapy-ng for one test, which no job ever actually installed.
  server:
    name: server tests (Python ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.7'
            runner: ubuntu-22.04
          - python: '3.12'
            runner: ubuntu-latest
          - python: '3.13'
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: bash tests/run.sh python3

      # Python held to a comparable bar to the sensor's clippy -D warnings. Bug-catching rules
      # only, and it passes clean — see ruff.toml for why the cosmetic ones are off.
      - name: Lint
        if: matrix.python == '3.12'
        run: |
          pip install ruff
          ruff check .

  # The sensor and the server report their version independently. They have already drifted
  # once. This keeps them equal on every commit; equality with the git TAG is a release-time
  # check, not a development-time one, because master legitimately runs ahead of the last tag.
  version:
    name: version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 because check_refs.py resolves cited commits, and a shallow clone has none
      # of them. It refuses to run on a shallow checkout rather than calling every citation broken.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 sensor/tools/check_version.py

      # git-filter-repo rewrote every SHA in this repository during the trails split, and five
      # citations were left dangling for weeks - including SECURITY.md's instructions for checking
      # whether you have the private key Maltrail used to ship, which answered "fatal: Not a valid
      # object name". Cheap to check, invisible when it breaks.
      - name: Cited commits still exist
        run: python3 sensor/tools/check_refs.py

      # There WAS a "static trails are reachable on the wire" step here. After the split it had
      # nothing to scan - no trails/ in this checkout, no sibling one on the runner - so it walked
      # a missing directory, reported "0 entry(ies) that cannot match" and passed. It gated on
      # nothing for months.
      #
      # The check itself is not gone: stamparm/trails runs it in gate.yml on every commit, over
      # the content it applies to, which is where it belongs. What this repository still ships -
      # data/mass_scanner.txt and data/mass_scanner_cidr.txt, 19,942 trails - is gated by
      # trails.yml. check_trails.py now exits 2 rather than 0 when handed an empty path, so this
      # cannot happen quietly again.

  # The Docker image's promise is that it works with the storage the operator hands it. Three
  # separate ways it did not - an unwritable bind mount, `cap_add` that granted nothing to a
  # non-root USER, and a compose file whose relative bind-mount paths did not resolve - all
  # shipped, because "it builds and the container starts" was the only thing being checked.
  # This runs against a real daemon and takes about a minute: it builds a small harness image
  # around docker/entrypoint.sh rather than the release image, so the answer arrives while the
  # change is still in front of you.
  docker:
    name: docker entrypoint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: bash docker/tests/entrypoint_test.sh

  # install.sh, run in five real distributions. Package names, a user that was not created, a unit
  # pointing at a binary that is not there, a libpcap named differently - every one of those is a
  # support thread, and none of them is visible from reading the script. The server is started and
  # asked for /ping in each environment, so "installed" means "runs".
  installer:
    name: install.sh (5 distributions)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # the harness serves the clone from this checkout over file://
      # Built the way the RELEASE builds it - inside AlmaLinux 8 (glibc 2.28) - so the sensor
      # assertions run on Debian 12 and Leap 15.6 too. Built with the runner's own toolchain
      # (glibc 2.39) the binary cannot exec there, those checks skip, and the fact that published
      # binaries do not start on most enterprise distributions stays invisible until someone
      # downloads one. This makes it a per-commit property instead of a release-time hope.
      - name: Build the sensor against the release's glibc baseline
        run: |
          docker run --rm -v "$PWD:/src" -w /src almalinux:8 sh -eu -c '
            dnf -y -q install dnf-plugins-core >/dev/null
            dnf config-manager --set-enabled powertools >/dev/null 2>&1 ||
              dnf config-manager --set-enabled crb >/dev/null 2>&1
            dnf -y -q install gcc libpcap-devel make >/dev/null
            export CARGO_HOME=/src/.cargo-home RUSTUP_HOME=/src/.rustup-home
            export PATH=$CARGO_HOME/bin:$PATH
            curl -sSf https://sh.rustup.rs -o /tmp/rustup.sh
            sh /tmp/rustup.sh -y --default-toolchain stable --profile minimal --no-modify-path >/dev/null
            cargo build --release --locked --manifest-path sensor/Cargo.toml
            strip sensor/target/release/maltrail-sensor
          '
          sudo chown -R "$(id -u):$(id -g)" sensor/target .cargo-home .rustup-home
          echo "highest glibc symbol: $(objdump -T sensor/target/release/maltrail-sensor | sed -n 's/.*GLIBC_\([0-9.]*\).*/\1/p' | sort -V -u | tail -1)"
      - run: bash tests/install/run.sh
      # The five environments above are single-architecture, so the SONAME repair always finds the
      # only libpcap there is. This one adds a second architecture's libpcap, which is what made it
      # pick the wrong file on a real machine.
      - run: bash tests/install/soname.sh

  # Rust dependency advisories. Gates the diff that introduces a vulnerable dependency.
  #
  # NOT rustsec/audit-check: that action only looks for ./Cargo.lock at the repository root, and
  # this project's lockfile lives in sensor/. Installing the tool and pointing it at the real
  # path is both explicit and one less thing that breaks when the layout moves.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit --file sensor/Cargo.lock
      # audit answers "is anything known-vulnerable today". deny answers the questions that
      # decide whether that stays true: licence compatibility, source registry, tree drift.
      - run: cargo deny --manifest-path sensor/Cargo.toml check
