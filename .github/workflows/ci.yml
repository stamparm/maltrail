# The gate. Every job here is the same thing a developer runs locally, so a green tick means
# `sensor/tools/check.sh` and `tests/run.sh` were actually executed — not approximated.
#
# Nothing in this repository is allowed to depend on someone remembering to run the tests.

name: CI

# Trail data is pushed many times a day and cannot affect the sensor's behaviour — it is the
# input, not the program. Running a ten-minute Rust gate on every indicator commit would make CI
# a tax on the project's most common and most valuable contribution, and a queue nobody waits
# for is a queue nobody trusts. Code, configuration, packaging and the runtime data files under
# data/ all still gate normally.
on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - 'CHANGELOG'
      - 'LICENSE'
      - 'CITATION.cff'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - 'CHANGELOG'
      - 'LICENSE'
      - 'CITATION.cff'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # The full Rust gate: generated-file freshness, fmt, clippy -D warnings, the suite in BOTH
  # debug (overflow checks on) and release (what ships), then differential parity against the
  # old Python sensor. Its real-trails steps self-skip here, because a runner has no trails.csv;
  # the `real-trails` job below builds one and runs the tests that need it.
  sensor:
    name: sensor gate (check.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcap-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # parity.py replays the corpus through old/sensor.py as the differential oracle.
      - name: Install the old sensor's capture bindings
        run: pip install -r old/requirements.txt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sensor

      - run: bash sensor/tools/check.sh

      # This job is the one place pcapy-ng is installed, so it is the one place the old-sensor
      # tests (test_config, test_fastfilter, test_sensor, test_fanout) actually execute. The
      # `server` matrix below runs the same suite without pcapy-ng and reports those four as
      # SKIP — deliberately, since neither the server nor the current sensor needs it.
      - name: Python suite, including the old-sensor tests
        run: bash tests/run.sh python3

  # The tests that need a REAL trail set, with one built for them.
  #
  # `tests/trails.rs` and `tests/loader_parity.rs` carry the two strongest assertions in the
  # repository — every row of the real trails.csv is findable with its own (info, reference), and
  # every row is loaded byte-identically to `core.common.load_trails()` — and both self-skip when
  # the machine has no trails file. On a runner that was always, so both printed `[skip]` and the
  # gate was green without them: the no-false-negative invariant behind the trail store's negative
  # prefilter was verified only on a developer's laptop, which is not a verification anyone else
  # can reproduce. `--offline` builds the set from the static pile in this checkout, no feed
  # fetched, which is exactly what the `floor` job already proves works on Python 3.6.
  #
  # (The generated-at-scale half of that invariant runs everywhere and needs no trail set:
  # `the_negative_filter_never_hides_a_key_at_real_scale` in tests/trails.rs.)
  real-trails:
    name: real trail set
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcap-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sensor

      - name: Build a trail set from the static pile
        run: |
          python3 sensor/tools/update_trails.py --offline -c maltrail.conf 2>&1 | grep -v '^\[?\] progress' | tail -4
          test -s "$HOME/.maltrail/trails.csv"
          echo "trails built: $(wc -l < "$HOME/.maltrail/trails.csv") rows"

      # --nocapture so the row counts, store size and parity numbers are in the log. A skipped
      # test PASSES, which is the failure mode this job exists to remove, so the skip note is
      # also grepped for: green here has to mean the walk actually ran.
      - name: Real-trail invariants (every row findable, loader parity with Python)
        run: |
          set -o pipefail
          cargo test --manifest-path sensor/Cargo.toml --release \
            --test trails --test loader_parity -- --nocapture 2>&1 | tee /tmp/real-trails.log
          if grep -q '\[skip\] no real trails file' /tmp/real-trails.log; then
            echo "::error::the real-trail tests skipped despite a trail set having been built"
            exit 1
          fi

  # The declared MSRV is a promise to operators on older distributions. Compile it, or it is
  # just a number in Cargo.toml. Deliberately NOT a rust-toolchain.toml: pinning that file would
  # make the repository's default toolchain the minimum one for every contributor.
  msrv:
    name: MSRV (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        rust: [ "1.74" ]
    steps:
      - uses: actions/checkout@v7
      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcap-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sensor
          key: msrv-${{ matrix.rust }}
      - name: Verify the crate builds on its declared minimum
        run: cargo check --manifest-path sensor/Cargo.toml --all-targets

  # The oldest interpreter Maltrail claims to run on, tested on the interpreter itself rather than
  # asserted in a README. One 3.7-only method call (str.isascii) once made the updater die on every
  # RHEL 8 / CentOS 7 / Leap 15 / Amazon Linux 2 box - empty trail set, sensor detecting nothing,
  # no error that said so. Its own job because GitHub retired the runners that could install 3.6,
  # so this runs in the official 3.6 image.
  floor:
    name: server tests (Python 3.6, the floor)
    runs-on: ubuntu-latest
    container: python:3.6-slim
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/run.sh python3

      # The suite proves the modules import and behave; this proves what actually broke on old
      # interpreters - that a trail set can be BUILT at all. Offline on purpose: it drives
      # core/update.py over the whole static pile without touching a third-party feed from CI.
      - name: Build a trail set
        run: |
          python3 sensor/tools/update_trails.py --offline -c maltrail.conf 2>&1 | grep -v '^\[?\] progress' | tail -4
          test -s "$HOME/.maltrail/trails.csv"
          echo "trails built: $(wc -l < "$HOME/.maltrail/trails.csv") lines"

  # setup-python no longer ships 3.7 for ubuntu-24.04, hence the pinned older runner for that entry.
  #
  # No pcapy-ng here on purpose: the server is standard library only, and that is exactly what
  # this matrix is proving. The four old-sensor test files report SKIP with a reason; the
  # `sensor` job above runs them for real.
  server:
    name: server tests (Python ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.7'
            runner: ubuntu-22.04
          - python: '3.12'
            runner: ubuntu-latest
          - python: '3.13'
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: bash tests/run.sh python3

      # Python held to a comparable bar to the sensor's clippy -D warnings. Bug-catching rules
      # only, and it passes clean — see ruff.toml for why the cosmetic ones are off.
      - name: Lint
        if: matrix.python == '3.12'
        run: |
          pip install ruff
          ruff check .

  # The sensor and the server report their version independently. They have already drifted
  # once. This keeps them equal on every commit; equality with the git TAG is a release-time
  # check, not a development-time one, because master legitimately runs ahead of the last tag.
  version:
    name: version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 sensor/tools/check_version.py

      # 97% of commits here touch trails/static, and a trail written in a form the sensor never
      # sees on the wire loads cleanly, occupies a row and matches nothing - indistinguishable
      # from "no detections". The tool existed but ran nowhere, because it reported a live
      # punycode trail as dead; with that false positive gone the exit status is worth gating on.
      - name: Static trails are reachable on the wire
        run: python3 sensor/tools/check_trails.py

  # The Docker image's promise is that it works with the storage the operator hands it. Three
  # separate ways it did not - an unwritable bind mount, `cap_add` that granted nothing to a
  # non-root USER, and a compose file whose relative bind-mount paths did not resolve - all
  # shipped, because "it builds and the container starts" was the only thing being checked.
  # This runs against a real daemon and takes about a minute: it builds a small harness image
  # around docker/entrypoint.sh rather than the release image, so the answer arrives while the
  # change is still in front of you.
  docker:
    name: docker entrypoint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: bash docker/tests/entrypoint_test.sh

  # install.sh, run in five real distributions. Package names, a user that was not created, a unit
  # pointing at a binary that is not there, a libpcap named differently - every one of those is a
  # support thread, and none of them is visible from reading the script. The server is started and
  # asked for /ping in each environment, so "installed" means "runs".
  installer:
    name: install.sh (5 distributions)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # the harness serves the clone from this checkout over file://
      # Built the way the RELEASE builds it - inside AlmaLinux 8 (glibc 2.28) - so the sensor
      # assertions run on Debian 12 and Leap 15.6 too. Built with the runner's own toolchain
      # (glibc 2.39) the binary cannot exec there, those checks skip, and the fact that published
      # binaries do not start on most enterprise distributions stays invisible until someone
      # downloads one. This makes it a per-commit property instead of a release-time hope.
      - name: Build the sensor against the release's glibc baseline
        run: |
          docker run --rm -v "$PWD:/src" -w /src almalinux:8 sh -eu -c '
            dnf -y -q install dnf-plugins-core >/dev/null
            dnf config-manager --set-enabled powertools >/dev/null 2>&1 ||
              dnf config-manager --set-enabled crb >/dev/null 2>&1
            dnf -y -q install gcc libpcap-devel make >/dev/null
            export CARGO_HOME=/src/.cargo-home RUSTUP_HOME=/src/.rustup-home
            export PATH=$CARGO_HOME/bin:$PATH
            curl -sSf https://sh.rustup.rs -o /tmp/rustup.sh
            sh /tmp/rustup.sh -y --default-toolchain stable --profile minimal --no-modify-path >/dev/null
            cargo build --release --locked --manifest-path sensor/Cargo.toml
            strip sensor/target/release/maltrail-sensor
          '
          sudo chown -R "$(id -u):$(id -g)" sensor/target .cargo-home .rustup-home
          echo "highest glibc symbol: $(objdump -T sensor/target/release/maltrail-sensor | sed -n 's/.*GLIBC_\([0-9.]*\).*/\1/p' | sort -V -u | tail -1)"
      - run: bash tests/install/run.sh
      # The five environments above are single-architecture, so the SONAME repair always finds the
      # only libpcap there is. This one adds a second architecture's libpcap, which is what made it
      # pick the wrong file on a real machine.
      - run: bash tests/install/soname.sh

  # Rust dependency advisories. Gates the diff that introduces a vulnerable dependency.
  #
  # NOT rustsec/audit-check: that action only looks for ./Cargo.lock at the repository root, and
  # this project's lockfile lives in sensor/. Installing the tool and pointing it at the real
  # path is both explicit and one less thing that breaks when the layout moves.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit --file sensor/Cargo.lock
      # audit answers "is anything known-vulnerable today". deny answers the questions that
      # decide whether that stays true: licence compatibility, source registry, tree drift.
      - run: cargo deny --manifest-path sensor/Cargo.toml check
