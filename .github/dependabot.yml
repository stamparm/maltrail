# Dependency updates, batched so they are reviewable rather than a stream of noise.
#
# The sensor has nine direct dependencies and the project has no Python ones at all, so this is a
# small surface — which is exactly why keeping it current is cheap and there is no excuse for
# drifting. `cargo audit` in ci.yml catches a vulnerable dependency the moment it is published;
# this is the routine half.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /sensor
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine bumps: nine crates producing nine PRs a week trains people to
      # ignore them, which is worse than not having the updates at all.
      cargo-minor-and-patch:
        update-types: [ minor, patch ]
    ignore:
      # Major bumps are an MSRV decision, not a routine update, so they are not offered.
      #
      # This is not hypothetical. The first batch Dependabot proposed - rusqlite 0.31 -> 0.40,
      # sha2 0.10 -> 0.11, aes 0.8 -> 0.9, hmac 0.12 -> 0.13 - all failed the MSRV job, because
      # they pull crates declaring `edition = "2024"`, which Rust 1.74 cannot even parse. Taking
      # them means raising rust-version to ~1.85 and telling every operator on an older
      # distribution to install a toolchain. That is a deliberate trade to make when there is a
      # reason for it, and none of those four offered one.
      #
      # SAFETY NET: this hides updates, not vulnerabilities. `cargo audit` in ci.yml checks the
      # versions actually in Cargo.lock and fails the build on a published advisory whether or
      # not Dependabot has offered anything, so a security fix that only exists in a new major
      # still stops CI and forces the MSRV conversation. To take a major deliberately:
      # `cargo update -p <crate> --precise <version>`, then fix the MSRV job or raise
      # rust-version in sensor/Cargo.toml.
      - dependency-name: "*"
        update-types: [ version-update:semver-major ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: [ "*" ]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
