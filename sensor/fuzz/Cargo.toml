[package]
name = "maltrail-sensor-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.maltrail-sensor]
path = ".."

# Each target is coverage-guided; see fuzz/README.md for how to run them.
[[bin]]
name = "packet"
path = "fuzz_targets/packet.rs"
test = false
doc = false

[[bin]]
name = "dns"
path = "fuzz_targets/dns.rs"
test = false
doc = false

[[bin]]
name = "http"
path = "fuzz_targets/http.rs"
test = false
doc = false

[[bin]]
name = "tls"
path = "fuzz_targets/tls.rs"
test = false
doc = false

[[bin]]
name = "quic"
path = "fuzz_targets/quic.rs"
test = false
doc = false

[[bin]]
name = "process"
path = "fuzz_targets/process.rs"
test = false
doc = false
